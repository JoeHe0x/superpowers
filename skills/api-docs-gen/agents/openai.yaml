interface:
  display_name: "API Docs Gen"
  short_description: "Reverse engineer Spring Boot API/business docs"
  default_prompt: "Use $api-docs-gen to inspect this Spring Boot service. Scope the analysis, build a full API inventory by scanning all @RestController and @Controller classes (combining class-level and method-level routes), trace the business flow for each endpoint from controller through service to repository and downstream calls, collect cross-cutting concerns (auth, validation, transactions, exception handling), then produce business logic documentation plus API docs using the doc-template. Include a Mermaid sequenceDiagram for each documented endpoint. Run the springboot-analysis-checklist before finalizing."
policy:
  allow_implicit_invocation: true
